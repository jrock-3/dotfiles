# ─── General ──────────────────────────────────────────────────────────
set-option -g default-shell /bin/zsh
set -g base-index 1
set -g pane-base-index 2
set -g renumber-windows on
set -s escape-time 0        # no delay after pressing Escape (instant mode switching in vim)
set -g history-limit 30000
set -g mouse on

# ─── Prefix ──────────────────────────────────────────────────────────
# C-a locally, C-b over SSH — avoids conflicts in nested sessions
if-shell '[ -n "$SSH_CONNECTION" ]' \
    'set -g prefix C-b; bind C-b send-prefix' \
    'set -g prefix C-a; unbind C-b; bind C-a send-prefix'

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind C-Space respawn-pane -k \; if-shell 'command -v declawd > /dev/null 2>&1' \
    'send-keys "declawd --yolo" Enter' \
    'send-keys "claude --dangerously-skip-permissions" Enter'

# ─── Navigation (vim-style) ──────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
set -g @yank_action 'copy-pipe-and-cancel'

# C-a + h/j/k/l: always navigate local panes (override passthrough below)
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# C-h/j/k/l smart navigation (replaces vim-tmux-navigator TPM plugin):
# - always pass through if current pane is vim
# - on local (no SSH_CONNECTION): also pass through if pane is running ssh
# - otherwise: navigate local tmux panes
if-shell '[ -n "$SSH_CONNECTION" ]' {
    bind-key -n C-h if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$"' 'send-keys C-h' 'select-pane -L'
    bind-key -n C-j if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$"' 'send-keys C-j' 'select-pane -D'
    bind-key -n C-k if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$"' 'send-keys C-k' 'select-pane -U'
    bind-key -n C-l if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$"' 'send-keys C-l' 'select-pane -R'
} {
    bind-key -n C-h if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +((\\S+\\/)?g?(view|n?vim?x?)(diff)?|(\\S+\\/)?(ssh|mosh(-client)?|autossh|coder))$"' 'send-keys C-h' 'select-pane -L'
    bind-key -n C-j if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +((\\S+\\/)?g?(view|n?vim?x?)(diff)?|(\\S+\\/)?(ssh|mosh(-client)?|autossh|coder))$"' 'send-keys C-j' 'select-pane -D'
    bind-key -n C-k if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +((\\S+\\/)?g?(view|n?vim?x?)(diff)?|(\\S+\\/)?(ssh|mosh(-client)?|autossh|coder))$"' 'send-keys C-k' 'select-pane -U'
    bind-key -n C-l if-shell 'ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +((\\S+\\/)?g?(view|n?vim?x?)(diff)?|(\\S+\\/)?(ssh|mosh(-client)?|autossh|coder))$"' 'send-keys C-l' 'select-pane -R'
}

bind-key -r M-h resize-pane -L 5
bind-key -r M-j resize-pane -D 5
bind-key -r M-k resize-pane -U 5
bind-key -r M-l resize-pane -R 5

# New splits inherit the current pane's working directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# ─── Popups ──────────────────────────────────────────────────────────
bind C-j display-popup -xC -yC -w 80% -h 75% -E \
    "tmux list-sessions | sed -E 's/:.*$//' | grep -v '^popup$' | fzf --reverse | xargs tmux switch-client -t"

bind C-f display-popup -xC -yC -w 80% -h 75% -E \
    "tmux list-windows -aF '#W (#S:#I)' | grep -v '(popup:' | fzf --reverse | sed -E 's|.+ \\(||;s|\\)||' | xargs tmux switch-client -t"

bind-key C-t if-shell -F '#{==:#{session_name},popup}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E \
        'tmux attach-session -t popup || tmux new-session -s popup \; set destroy-unattached on'
}

# Bounce any non-popup client that lands on the popup session back to its previous session
set-hook -g client-session-changed \
    "if-shell -F '#{&&:#{==:#{session_name},popup},#{client_last_session}}' 'switch-client -l'"

bind-key C-g display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 75% -E 'lazygit'
bind-key C-o display-popup -xC -yC -w 80% -h 75% -E 'btop'

# ─── Plugins ─────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux'

# ─── Session persistence ─────────────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# ─── Theme (Catppuccin) ──────────────────────────────────────────────
set -g status-position top
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_text " #{window_name}"
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_session_text "#{session_name}"

# ─── Init (must be last) ─────────────────────────────────────────────
if-shell '[ -f ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux ]' \
    'run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
if-shell '[ -f ~/.config/tmux/plugins/tpm/tpm ]' \
    'run ~/.config/tmux/plugins/tpm/tpm'
